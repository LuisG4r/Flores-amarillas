<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Para ti 🌻</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    font-family:Georgia,"Times New Roman",serif;
    background:#f8f1df;
}

/* =====================================================
   ROTACIÓN
===================================================== */

#rotateScreen{
    position:fixed;
    inset:0;
    z-index:10000;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    background:#f8f1df;
    color:#624d32;
}

.rotate-phone{
    font-size:70px;
    margin-bottom:20px;
    animation:rotatePhone 2s infinite ease-in-out;
}

#rotateScreen p{
    margin:0;
    font-size:25px;
    font-style:italic;
}

@keyframes rotatePhone{
    0%,100%{
        transform:rotate(0deg);
    }

    45%,65%{
        transform:rotate(90deg);
    }
}

@media (orientation:portrait){

    #rotateScreen{
        display:flex;
    }

    #intro,
    #phrases,
    #garden,
    #photoViewer,
    #messageBox{
        visibility:hidden;
    }
}

/* =====================================================
   INTRO
===================================================== */

#intro{
    position:fixed;
    inset:0;
    z-index:9000;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#f8f1df;
    touch-action:manipulation;
}

#introFlower{
    position:relative;
    width:125px;
    height:125px;
    cursor:pointer;
    animation:floatFlower 3s ease-in-out infinite;
}

.introPetal{
    position:absolute;
    width:48px;
    height:75px;
    left:50%;
    top:50%;
    transform-origin:50% 85%;
    border-radius:50% 50% 45% 45%;
    background:#f4c51d;
}

.introPetal:nth-child(1){
    transform:translate(-50%,-85%) rotate(0deg);
}

.introPetal:nth-child(2){
    transform:translate(-50%,-85%) rotate(45deg);
}

.introPetal:nth-child(3){
    transform:translate(-50%,-85%) rotate(90deg);
}

.introPetal:nth-child(4){
    transform:translate(-50%,-85%) rotate(135deg);
}

.introPetal:nth-child(5){
    transform:translate(-50%,-85%) rotate(180deg);
}

.introPetal:nth-child(6){
    transform:translate(-50%,-85%) rotate(225deg);
}

.introPetal:nth-child(7){
    transform:translate(-50%,-85%) rotate(270deg);
}

.introPetal:nth-child(8){
    transform:translate(-50%,-85%) rotate(315deg);
}

.introCenter{
    position:absolute;
    width:45px;
    height:45px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#75491e;
    z-index:3;
}

#pressText{
    margin-top:30px;
    font-size:23px;
    font-style:italic;
    color:#624d32;
    pointer-events:none;
}

@keyframes floatFlower{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-9px);
    }
}

/* =====================================================
   FRASES
===================================================== */

#phrases{
    position:fixed;
    inset:0;
    z-index:8000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:30px;
    text-align:center;
    background:#f8f1df;
}

.phrase{
    position:absolute;
    max-width:90%;
    opacity:0;
    color:#59452d;
    font-size:27px;
    line-height:1.45;
    font-style:italic;
    transition:opacity 1.3s ease;
}

.phrase.show{
    opacity:1;
}

/* =====================================================
   JARDÍN
===================================================== */

#garden{
    position:fixed;
    inset:0;
    display:none;
    overflow:hidden;

    background:
        linear-gradient(
            to bottom,
            #bfe3f2 0%,
            #d8edf4 53%,
            #82b95e 54%,
            #4f963f 100%
        );
}

/* SOL */

.sun{
    position:absolute;
    width:105px;
    height:105px;
    right:8%;
    top:7%;
    border-radius:50%;
    background:#ffd45c;
    box-shadow:0 0 45px rgba(255,211,80,.55);
    z-index:2;
}

/* =====================================================
   TENDEDERO
   IMPORTANTE:
   LOS POSTES QUEDAN DETRÁS DE LAS FLORES
===================================================== */

.clothesline-post{
    position:absolute;
    top:0;
    width:14px;
    height:45%;
    border-radius:8px;
    background:#8b5e34;
    z-index:5;
    pointer-events:none;
}

.clothesline-post.left{
    left:2%;
}

.clothesline-post.right{
    right:2%;
}

.clothesline{
    position:absolute;
    left:2%;
    right:2%;
    top:8%;
    height:3px;
    background:#765738;
    z-index:5;
    pointer-events:none;
}

.clothesline-sag{
    position:absolute;
    left:2%;
    right:2%;
    top:8%;
    height:35px;
    border-bottom:3px solid #765738;
    border-radius:0 0 50% 50%;
    z-index:4;
    pointer-events:none;
}

/* =====================================================
   CAMPO DE FLORES
===================================================== */

.field{
    position:absolute;
    inset:0;
    z-index:10;
}

/*
   IMPORTANTE:
   NO HAY TALLOS.
   NO HAY HOJAS.
*/

.field-flower{
    position:absolute;

    width:120px;
    height:210px;

    left:var(--left);
    top:var(--top);

    transform:
        translate(-50%,-50%)
        scale(var(--scale))
        rotate(var(--rotate));

    transform-origin:center center;

    z-index:var(--depth);

    pointer-events:none;
}

.flower-head{
    position:absolute;

    width:76px;
    height:76px;

    left:50%;
    top:calc(50% + var(--head-offset));

    transform:translate(-50%,-50%);

    transform-origin:center center;
}

.petal{
    position:absolute;

    width:32px;
    height:58px;

    left:50%;
    top:50%;

    transform-origin:50% 90%;

    border-radius:50% 50% 45% 45%;

    background:#f5c719;
}

.petal:nth-child(1){
    transform:translate(-50%,-90%) rotate(0deg);
}

.petal:nth-child(2){
    transform:translate(-50%,-90%) rotate(45deg);
}

.petal:nth-child(3){
    transform:translate(-50%,-90%) rotate(90deg);
}

.petal:nth-child(4){
    transform:translate(-50%,-90%) rotate(135deg);
}

.petal:nth-child(5){
    transform:translate(-50%,-90%) rotate(180deg);
}

.petal:nth-child(6){
    transform:translate(-50%,-90%) rotate(225deg);
}

.petal:nth-child(7){
    transform:translate(-50%,-90%) rotate(270deg);
}

.petal:nth-child(8){
    transform:translate(-50%,-90%) rotate(315deg);
}

.flower-center{
    position:absolute;

    width:35px;
    height:35px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:#74481f;

    z-index:4;
}

/* FLORES ESPECIALES */

.field-flower.special::after{
    content:"";

    position:absolute;

    width:72px;
    height:72px;

    left:50%;
    top:calc(50% + var(--head-offset));

    transform:translate(-50%,-50%);

    border-radius:50%;

    box-shadow:
        0 0 20px 5px rgba(255,215,50,.45);

    pointer-events:none;
}

/* =====================================================
   ÁREA INVISIBLE PARA TOCAR LAS FLORES
===================================================== */

.flower-hit{
    position:absolute;

    width:100px;
    height:100px;

    left:50%;
    top:calc(50% + var(--head-offset));

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:transparent;

    z-index:999;

    cursor:pointer;

    pointer-events:auto;
}

/* =====================================================
   VISOR DE FOTOS
===================================================== */

#photoViewer{
    position:fixed;
    inset:0;

    z-index:20000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:25px;

    background:rgba(30,22,12,.84);

    backdrop-filter:blur(5px);
}

#photoViewer.show{
    display:flex;
}

#bigPhoto{
    max-width:92vw;
    max-height:82vh;

    width:auto;
    height:auto;

    object-fit:contain;

    border:10px solid #fffdf7;

    box-shadow:
        0 15px 45px rgba(0,0,0,.4);

    animation:photoAppear .5s ease;
}

#closePhoto{
    position:absolute;

    top:18px;
    right:20px;

    width:48px;
    height:48px;

    border:0;
    border-radius:50%;

    background:#fffdf7;

    color:#4b3824;

    font-family:Arial,sans-serif;
    font-size:30px;
    line-height:48px;

    padding:0;

    cursor:pointer;

    z-index:20001;
}

@keyframes photoAppear{

    from{
        opacity:0;
        transform:scale(.75);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =====================================================
   TENDEDERO DE FOTOS
===================================================== */

.photo-line{
    position:absolute;

    left:0;
    right:0;

    top:9%;

    height:1px;

    z-index:30;

    pointer-events:none;
}

.photo-polaroid{
    position:absolute;

    width:105px;

    padding:7px 7px 25px;

    background:#fffdf8;

    box-shadow:
        0 5px 15px rgba(0,0,0,.25);

    transform-origin:top center;

    animation:hangPhoto .7s ease forwards;
}

.photo-polaroid img{
    display:block;

    width:100%;
    height:95px;

    object-fit:cover;
}

.peg{
    position:absolute;

    width:14px;
    height:34px;

    left:50%;
    top:-14px;

    transform:translateX(-50%);

    background:
        linear-gradient(
            90deg,
            #9b6a38 0 42%,
            #6f4726 42% 58%,
            #b77d43 58% 100%
        );

    border-radius:3px 3px 6px 6px;

    box-shadow:
        1px 2px 3px rgba(0,0,0,.25);
}

@keyframes hangPhoto{

    from{
        opacity:0;
        transform:
            translateY(-30px)
            rotate(0deg)
            scale(.7);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            rotate(var(--rotation))
            scale(1);
    }
}

/* =====================================================
   MENSAJES
===================================================== */

#messageBox{
    position:fixed;
    inset:0;

    z-index:15000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:25px;

    background:rgba(40,25,10,.42);

#messageBox.show{
    display:flex;

.message-card{
    width:min(88vw,500px);

    padding:35px 28px;

    border-radius:20px;

    background:#fff9ea;

    box-shadow:
        0 15px 45px rgba(0,0,0,.3);

    text-align:center;

    animation:messageAppear .45s ease;
}

.message-card p{
    margin:0;

    color:#62482d;

    font-size:25px;
    line-height:1.5;

    font-style:italic;

.message-card button{
    margin-top:25px;

    border:0;

    padding:11px 25px;

    border-radius:30px;

    background:#d99b25;
    color:white;

    font-family:inherit;
    font-size:17px;
}

@keyframes messageAppear{

    from{
        opacity:0;
        transform:scale(.8);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =====================================================
   SEMILLA
===================================================== */

.seed{
    position:fixed;

    width:12px;
    height:18px;

    left:50%;
    top:35%;

    transform:translateX(-50%);

    border-radius:50%;

    background:#69421d;

    z-index:9500;

    animation:seedFall 1.7s ease-in forwards;
}

@keyframes seedFall{

    0%{
        opacity:0;

        transform:
            translate(-50%,-80px)
            rotate(0);
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,60vh)
            rotate(300deg);
    }
}

/* =====================================================
   FADE
===================================================== */

        opacity:0;

/* =====================================================

===================================================== */

function createFlower(data,index){

    const flower =
        document.createElement("div");

    flower.className =
        "field-flower";

    if(data.message){

        flower.classList.add("special");

    }

    flower.style.setProperty(
        "--left",
        data.left
    );

    flower.style.setProperty(
        "--top",
        data.top
    );

    flower.style.setProperty(
        "--scale",
        data.scale
    );

    flower.style.setProperty(
        "--rotate",
        data.rotate
    );

    flower.style.setProperty(
        "--head-offset",
        data.headOffset
    );

    if(data.scale >= .80){

        flower.style.setProperty(
            "--depth",
            400
        );

    }

    else if(data.scale >= .55){

        flower.style.setProperty(
            "--depth",
            250
        );

    }

    else{

        flower.style.setProperty(
            "--depth",
            100
        );

    }


    /* Cabeza de flor */

    const head =
        document.createElement("div");

    head.className =
        "flower-head";


    /* Pétalos */

    for(let i=0;i<8;i++){

        const petal =
            document.createElement("div");

        petal.className =
            "petal";

        head.appendChild(petal);

    }


    /* Centro */

    const center =
        document.createElement("div");

    center.className =
        "flower-center";

    head.appendChild(center);

    flower.appendChild(head);

    ================================================= */

    const hit =
        document.createElement("div");

    hit.className =
        "flower-hit";

    hit.style.setProperty(
        "--head-offset",
        data.headOffset
    );


    /*
       FLOR CON MENSAJE
    */

    if(data.message){

        hit.addEventListener(
            "click",
            function(e){

                e.stopPropagation();

                showMessage(data.message);

            }
        );

        hit.addEventListener(
            "touchend",
            function(e){

                e.preventDefault();
                e.stopPropagation();

                showMessage(data.message);

            },
            {passive:false}
        );

    }


    /*
       FLOR CON FOTO
    */

    else if(
        Object.prototype.hasOwnProperty.call(
            photoFlowerMap,
            index
        )
    ){

        const photoIndex =
            photoFlowerMap[index];

        hit.dataset.found =
            "false";

        hit.addEventListener(
            "click",
            function(e){

                e.stopPropagation();

                openPhoto(
                    photos[photoIndex],
                    photoIndex,
                    hit
                );

            }
        );

        hit.addEventListener(
            "touchend",
            function(e){

                e.preventDefault();
                e.stopPropagation();

                openPhoto(
                    photos[photoIndex],
                    photoIndex,
                    hit
                );

            },
            {passive:false}
        );

    }


    flower.appendChild(hit);

    field.appendChild(flower);

}


/* Crear jardín */

flowers.forEach(
    createFlower
);


/* =====================================================
   INTRO
===================================================== */

function startIntro(){

    if(introStarted){
        return;
    }

    introStarted = true;

    introFlower.classList.add(
        "fadeOut"
    );

    document
        .getElementById("pressText")
        .classList.add("fadeOut");


    setTimeout(
        function(){

            const seed =
                document.createElement("div");

            seed.className =
                "seed";

            document.body.appendChild(seed);

        },
        450
    );


    setTimeout(
        function(){

            intro.style.display =
                "none";

            showPhrases();

        },
        1100
    );

}


intro.addEventListener(
    "click",
    startIntro
);


intro.addEventListener(
    "touchend",
    function(e){

        e.preventDefault();

        startIntro();

    },
    {passive:false}
);


introFlower.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        startIntro();

    }
);


/* =====================================================
   FRASES
===================================================== */

function showPhrases(){

    phrases.style.display =
        "flex";

    let current = 0;


    function nextPhrase(){

        if(current > 0){

            phraseElements[
                current - 1
            ].classList.remove("show");

        }


        if(current >= phraseElements.length){

            setTimeout(
                function(){

                    phrases.style.display =
                        "none";

                    garden.style.display =
                        "block";

                },
                1200
            );

            return;
        }


        phraseElements[
            current
        ].classList.add("show");


        setTimeout(
            function(){

                phraseElements[
                    current
                ].classList.remove("show");

                current++;

                setTimeout(
                    nextPhrase,
                    700
                );

            },
            3000
        );

    }


    nextPhrase();

}


/* =====================================================
   ABRIR FOTO
===================================================== */

function openPhoto(
    photoName,
    index,
    hit
){

    if(
        hit &&
        hit.dataset.found === "true"
    ){
        return;
    }


    currentPhoto =
        photoName;

    currentPhotoIndex =
        index;


    if(hit){

        hit.dataset.found =
            "true";

    }


    bigPhoto.src =
        photoName;


    bigPhoto.onerror =
        function(){

            console.error(
                "No se pudo cargar:",
                photoName
            );

        };


    photoViewer.classList.add(
        "show"
    );

}


/* =====================================================
   CERRAR FOTO
===================================================== */

function closeCurrentPhoto(){

    if(currentPhoto === null){

        photoViewer.classList.remove(
            "show"
        );

        return;
    }


    const photoName =
        currentPhoto;

    const index =
        currentPhotoIndex;


    photoViewer.classList.remove(
        "show"
    );


    /*
       Primero desaparece la foto grande.
       Después aparece en el tendedero.
    */

    setTimeout(
        function(){

            sendPhotoToLine(
                photoName,
                index
            );

        },
        350
    );


    currentPhoto = null;
    currentPhotoIndex = null;

}


closePhoto.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        closeCurrentPhoto();

    }
);


closePhoto.addEventListener(
    "touchend",
    function(e){

        e.preventDefault();
        e.stopPropagation();

        closeCurrentPhoto();

    },
    {passive:false}
);


/* Cerrar tocando fuera */

photoViewer.addEventListener(
    "click",
    function(e){

        if(
            e.target === photoViewer
        ){

            closeCurrentPhoto();

        }

    }
);


/* =====================================================
   FOTO AL TENDEDERO
===================================================== */

function sendPhotoToLine(
    photoName,
    index
){

    /*
       Evitar duplicados.
    */

    const existing =
        document.querySelector(
            '.photo-polaroid[data-photo="' +
            photoName.replace(
                /"/g,
                '\\"'
            ) +
            '"]'
        );

    if(existing){
        return;
    }


    const slot =
        photoSlots[index] ||
        photoSlots[0];


    const polaroid =
        document.createElement("div");

    polaroid.className =
        "photo-polaroid";

    polaroid.dataset.photo =
        photoName;

    polaroid.style.left =
        slot.left;

    polaroid.style.setProperty(
        "--rotation",
        slot.rotation
    );


    const img =
        document.createElement("img");

    img.src =
        photoName;

    img.alt =
        "Nuestro recuerdo";


    const peg =
        document.createElement("div");

    peg.className =
        "peg";


    polaroid.appendChild(img);

    polaroid.appendChild(peg);

    photoLine.appendChild(
        polaroid
    );

}


/* =====================================================
   MENSAJES
===================================================== */

function showMessage(message){

    messageText.textContent =
        message;

    messageBox.classList.add(
        "show"
    );

}


function closeMsg(){

    messageBox.classList.remove(
        "show"
    );

}


closeMessage.addEventListener(
    "click",
    closeMsg
);


closeMessage.addEventListener(
    "touchend",
    function(e){

        e.preventDefault();

        closeMsg();

    },
    {passive:false}
);


messageBox.addEventListener(
    "click",
    function(e){

        if(
            e.target === messageBox
        ){

            closeMsg();

        }

    }
);


/* =====================================================
   EVITAR GESTOS DE ZOOM ACCIDENTALES
===================================================== */

document.addEventListener(
    "gesturestart",
    function(e){

        e.preventDefault();

    },
    {passive:false}
);
