<!DOCTYPE html>
<html lang="es">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Georgia,"Times New Roman",serif;
    background:#f8f1df;
}

/* =========================
   ROTACIÓN
========================= */

#rotateScreen{
    position:fixed;
    inset:0;
    z-index:10000;
    background:#f8f1df;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    color:#624d32;
}

.rotate-phone{
    font-size:70px;
    animation:rotatePhone 2s infinite ease-in-out;
    margin-bottom:20px;
}

#rotateScreen p{
    font-size:25px;
    font-style:italic;
    margin:0;
}

@keyframes rotatePhone{
    0%,100%{transform:rotate(0deg);}
    45%{transform:rotate(90deg);}
    65%{transform:rotate(90deg);}
}

/* =========================
   INTRO
========================= */

#intro{
    position:fixed;
    inset:0;
    z-index:9000;
    background:#f8f1df;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    touch-action:manipulation;
}

#introFlower{
    position:relative;
    width:125px;
    height:125px;
    cursor:pointer;
    animation:floatFlower 3s ease-in-out infinite;
}

.introPetal{
    position:absolute;
    width:48px;
    height:75px;
    background:#f4c51d;
    border-radius:50% 50% 45% 45%;
    left:50%;
    top:50%;
    transform-origin:50% 85%;
}

.introPetal:nth-child(1){transform:translate(-50%,-85%) rotate(0deg);}
.introPetal:nth-child(2){transform:translate(-50%,-85%) rotate(45deg);}
.introPetal:nth-child(3){transform:translate(-50%,-85%) rotate(90deg);}
.introPetal:nth-child(4){transform:translate(-50%,-85%) rotate(135deg);}
.introPetal:nth-child(5){transform:translate(-50%,-85%) rotate(180deg);}
.introPetal:nth-child(6){transform:translate(-50%,-85%) rotate(225deg);}
.introPetal:nth-child(7){transform:translate(-50%,-85%) rotate(270deg);}
.introPetal:nth-child(8){transform:translate(-50%,-85%) rotate(315deg);}

.introCenter{
    position:absolute;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#75491e;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:3;
}

#pressText{
    margin-top:30px;
    font-size:23px;
    color:#624d32;
    font-style:italic;
    pointer-events:none;
}

@keyframes floatFlower{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-9px);}
}

/* =========================
   FRASES
========================= */

#phrases{
    position:fixed;
    inset:0;
    z-index:8000;
    background:#f8f1df;
    display:none;
    align-items:center;
    justify-content:center;
    padding:30px;
    text-align:center;
}

.phrase{
    position:absolute;
    max-width:90%;
    font-size:27px;
    line-height:1.45;
    font-style:italic;
    color:#59452d;
    opacity:0;
    transition:opacity 1.3s ease;
}

.phrase.show{
    opacity:1;
}

/* =========================
   JARDÍN
========================= */

#garden{
    position:fixed;
    inset:0;
    overflow:hidden;
    display:none;
    background:
        linear-gradient(
            to bottom,
            #bfe3f2 0%,
            #d8edf4 53%,
            #82b95e 54%,
            #4f963f 100%
        );
}

/* sol */

.sun{
    position:absolute;
    width:105px;
    height:105px;
    right:8%;
    top:7%;
    border-radius:50%;
    background:#ffd45c;
    box-shadow:0 0 45px rgba(255,211,80,.55);
    z-index:2;
}

/* =========================
   TENDEDOR
========================= */

.clothesline-post{
    position:absolute;
    width:14px;
    height:45%;
    top:0;
    background:#8b5e34;
    border-radius:8px;
    z-index:5;
}

.clothesline-post.left{
    left:2%;
}

.clothesline-post.right{
    right:2%;
}

.clothesline{
    position:absolute;
    left:2%;
    right:2%;
    top:8%;
    height:3px;
    background:#765738;
    z-index:5;
}

.clothesline-sag{
    position:absolute;
    left:2%;
    right:2%;
    top:8%;
    height:35px;
    border-bottom:3px solid #765738;
    border-radius:0 0 50% 50%;
    z-index:4;
    pointer-events:none;
}

/* =========================
   FLORES
========================= */

.field{
    position:absolute;
    inset:0;
    z-index:10;
}

.field-flower{
    position:absolute;
    width:120px;
    height:210px;
    left:var(--left);
    top:var(--top);
    transform:
        translate(-50%,-50%)
        scale(var(--scale))
        rotate(var(--rotate));
    transform-origin:center center;
    z-index:var(--depth);
    pointer-events:none;
}

/*
   IMPORTANTE:
   NO HAY TALLOS NI HOJAS.
*/

.flower-head{
    position:absolute;
    width:76px;
    height:76px;
    left:50%;
    top:calc(50% + var(--head-offset));
    transform:translate(-50%,-50%);
    transform-origin:center center;
}

.petal{
    position:absolute;
    width:32px;
    height:58px;
    left:50%;
    top:50%;
    transform-origin:50% 90%;
    background:#f5c719;
    border-radius:50% 50% 45% 45%;
}

.petal:nth-child(1){transform:translate(-50%,-90%) rotate(0deg);}
.petal:nth-child(2){transform:translate(-50%,-90%) rotate(45deg);}
.petal:nth-child(3){transform:translate(-50%,-90%) rotate(90deg);}
.petal:nth-child(4){transform:translate(-50%,-90%) rotate(135deg);}
.petal:nth-child(5){transform:translate(-50%,-90%) rotate(180deg);}
.petal:nth-child(6){transform:translate(-50%,-90%) rotate(225deg);}
.petal:nth-child(7){transform:translate(-50%,-90%) rotate(270deg);}
.petal:nth-child(8){transform:translate(-50%,-90%) rotate(315deg);}

.flower-center{
    position:absolute;
    width:35px;
    height:35px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:#74481f;
    border-radius:50%;
    z-index:4;
}

.field-flower.special .flower-center{
    background:#654019;
}

.field-flower.special::after{
    content:"";
    position:absolute;
    width:72px;
    height:72px;
    left:50%;
    top:calc(50% + var(--head-offset));
    transform:translate(-50%,-50%);
    border-radius:50%;
    box-shadow:0 0 20px 5px rgba(255,215,50,.45);
    pointer-events:none;
}

/* =========================
   ZONAS INVISIBLES DE TOQUE
========================= */

.flower-hit{
    position:absolute;
    width:100px;
    height:100px;
    left:50%;
    top:calc(50% + var(--head-offset));
    transform:translate(-50%,-50%);
    border-radius:50%;
    z-index:999;
    cursor:pointer;
    pointer-events:auto;
    background:transparent;
}

/* =========================
   VISOR DE FOTO
========================= */

#photoViewer{
    position:fixed;
    inset:0;
    z-index:20000;
    background:rgba(30,22,12,.82);
    display:none;
    align-items:center;
    justify-content:center;
    padding:25px;
    backdrop-filter:blur(5px);
}

#photoViewer.show{
    display:flex;
}

#bigPhoto{
    max-width:92vw;
    max-height:82vh;
    width:auto;
    height:auto;
    object-fit:contain;
    border:10px solid #fffdf7;
    box-shadow:0 15px 45px rgba(0,0,0,.4);
    animation:photoAppear .5s ease;
}

#closePhoto{
    position:absolute;
    top:18px;
    right:20px;
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    background:#fffdf7;
    color:#4b3824;
    font-size:30px;
    line-height:48px;
    padding:0;
    cursor:pointer;
    z-index:20001;
}

@keyframes photoAppear{
    from{
        opacity:0;
        transform:scale(.75);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =========================
   FOTOS DEL TENDEDERO
========================= */

.photo-line{
    position:absolute;
    left:0;
    right:0;
    top:9%;
    height:1px;
    z-index:30;
    pointer-events:none;
}

.photo-polaroid{
    position:absolute;
    width:105px;
    padding:7px 7px 25px;
    background:#fffdf8;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
    transform-origin:top center;
    animation:hangPhoto .7s ease forwards;
}

.photo-polaroid img{
    display:block;
    width:100%;
    height:95px;
    object-fit:cover;
}

.peg{
    position:absolute;
    width:14px;
    height:34px;
    left:50%;
    top:-14px;
    transform:translateX(-50%);
    background:
        linear-gradient(
            90deg,
            #9b6a38 0 42%,
            #6f4726 42% 58%,
            #b77d43 58% 100%
        );
    border-radius:3px 3px 6px 6px;
    box-shadow:1px 2px 3px rgba(0,0,0,.25);
}

@keyframes hangPhoto{
    from{
        opacity:0;
        transform:translateY(-30px) rotate(0deg) scale(.7);
    }
    to{
        opacity:1;
        transform:translateY(0) rotate(var(--rotation)) scale(1);
    }

/* =========================
   MENSAJE DE FLORES
========================= */

    position:fixed;
    inset:0;
    z-index:15000;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(40,25,10,.42);
    padding:25px;
}

#messageBox.show{
    display:flex;
}

.message-card{
    width:min(88vw,500px);
    background:#fff9ea;
    padding:35px 28px;
    border-radius:20px;
    box-shadow:0 15px 45px rgba(0,0,0,.3);
    text-align:center;
    animation:messageAppear .45s ease;
}

.message-card p{
    margin:0;
    font-size:25px;
    line-height:1.5;
    color:#62482d;
    font-style:italic;
}

.message-card button{
    margin-top:25px;
    border:0;
    background:#d99b25;
    color:white;
    padding:11px 25px;
    border-radius:30px;
    font-family:inherit;
    font-size:17px;
}

@keyframes messageAppear{
    from{
        opacity:0;
        transform:scale(.8);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =========================
   SEMILLA
========================= */

.seed{
    position:fixed;
    width:12px;
    height:18px;
    border-radius:50% 50% 50% 50%;
    background:#69421d;
    z-index:9500;
    left:50%;
    top:35%;
    transform:translateX(-50%);
    animation:seedFall 1.7s ease-in forwards;
}

@keyframes seedFall{
    0%{
        opacity:0;
        transform:translate(-50%,-80px) rotate(0);
    }
    20%{
        opacity:1;
    }
    100%{
        opacity:0;
        transform:translate(-50%,60vh) rotate(300deg);
    }
}

/* =========================
   TRANSICIONES
========================= */

.fadeOut{
    animation:fadeOut .8s forwards;
}

@keyframes fadeOut{
    to{opacity:0;}
}

/* =========================
   MODO HORIZONTAL
========================= */

@media (orientation:portrait){
    #rotateScreen{
        display:flex;
    }

    #intro,
    #phrases,
    #garden,
    #photoViewer,
    #messageBox{
        visibility:hidden;
    }
}

@media (orientation:landscape){
    #rotateScreen{
        display:none;
    }
}

/* =====================================================
   CREAR FLORES
===================================================== */

function createFlower(data,index){

    const flower = document.createElement("div");

    flower.className = "field-flower";

    if(data.message){
        flower.classList.add("special");
    }

    flower.style.setProperty("--left",data.left);
    flower.style.setProperty("--top",data.top);
    flower.style.setProperty("--scale",data.scale);
    flower.style.setProperty("--rotate",data.rotate);
    flower.style.setProperty("--head-offset",data.headOffset);

    /*
       Profundidad basada en tamaño.
       Las flores grandes quedan delante,
       las pequeñas detrás.
    */

    if(data.scale >= .80){
        flower.style.setProperty("--depth",400);
    }
    else if(data.scale >= .55){
        flower.style.setProperty("--depth",250);
    }
    else{
        flower.style.setProperty("--depth",100);
    }

    const head = document.createElement("div");
    head.className = "flower-head";

    for(let i=0;i<8;i++){

        const petal = document.createElement("div");

        petal.className = "petal";

        head.appendChild(petal);
    }

    const center = document.createElement("div");
    center.className = "flower-center";

    head.appendChild(center);
    flower.appendChild(head);

    /* ==========================================
       HITBOX INVISIBLE
    ========================================== */

    const hit = document.createElement("div");

    hit.className = "flower-hit";

    hit.style.setProperty("--head-offset",data.headOffset);

    /*
       Guardamos índice.
    */

    hit.dataset.index = index;

    /*
       Si tiene mensaje, abre mensaje.
       Si tiene foto, abre foto.
    */

    if(data.message){

        hit.addEventListener("click",function(e){

            e.stopPropagation();

            showMessage(data.message);

        });

        hit.addEventListener("touchend",function(e){

            e.preventDefault();
            e.stopPropagation();

            showMessage(data.message);

        },{passive:false});

    }
    else{

        /*
           Las primeras 7 flores sin mensaje
           encuentran las 7 fotografías.
        */

        if(index < 7){

            hit.dataset.photoIndex = index;
            hit.dataset.found = "false";

            hit.addEventListener("click",function(e){

                e.stopPropagation();

                openPhoto(
                    photos[index],
                    index,
                    hit
                );

            });

            hit.addEventListener("touchend",function(e){

                e.preventDefault();
                e.stopPropagation();

                openPhoto(
                    photos[index],
                    index,
                    hit
                );

            },{passive:false});

        }

    }

    flower.appendChild(hit);

    field.appendChild(flower);
}

/* =====================================================

/* Click normal */

intro.addEventListener("click",startIntro);

/* Touch iPhone */

intro.addEventListener("touchend",function(e){

    e.preventDefault();

    startIntro();

},{passive:false});

/* También permitimos tocar directamente la flor */

introFlower.addEventListener("click",function(e){

    e.stopPropagation();

    startIntro();

});

/* =====================================================
   FRASES
===================================================== */

function showPhrases(){

    phrases.style.display = "flex";

    let current = 0;

    function nextPhrase(){

        if(current > 0){
            phraseElements[current-1].classList.remove("show");
        }

        if(current >= phraseElements.length){

            setTimeout(function(){

                phrases.style.display = "none";

                garden.style.display = "block";

            },1200);

            return;
        }

        phraseElements[current].classList.add("show");

        setTimeout(function(){

            phraseElements[current].classList.remove("show");

            current++;

            setTimeout(nextPhrase,700);

        },3000);
    }

    nextPhrase();
}

/* =====================================================
   ABRIR FOTO GRANDE
===================================================== */

function openPhoto(photoName,index,hit){

    /*
       Si ya fue encontrada, no vuelve a abrirse.
    */

    if(hit && hit.dataset.found === "true"){
        return;
    }

    currentPhoto = photoName;
    currentPhotoIndex = index;

    /*
       MARCAMOS LA FOTO COMO ENCONTRADA.
    */

    if(hit){
        hit.dataset.found = "true";
    }

    /*
       Cargamos la foto.
       IMPORTANTE:
       las imágenes están en la raíz del repositorio.
    */

    bigPhoto.src = photoName;

    bigPhoto.onerror = function(){

        console.error(
            "No se pudo cargar la foto:",
            photoName
        );

        alert(
            "No se pudo cargar esta foto. Revisa que el nombre del archivo en GitHub sea exactamente:\n\n" +
            photoName
        );

    };

    /*
       MOSTRAR VISOR.
    */

    photoViewer.classList.add("show");
}

/* =====================================================
   CERRAR FOTO
===================================================== */

closePhoto.addEventListener("click",function(e){

    e.stopPropagation();

    closeCurrentPhoto();

});

closePhoto.addEventListener("touchend",function(e){

    e.preventDefault();
    e.stopPropagation();

    closeCurrentPhoto();

},{passive:false});

/* También cerrar tocando fuera de la foto */

photoViewer.addEventListener("click",function(e){

    if(e.target === photoViewer){

        closeCurrentPhoto();

    }

});

/* =====================================================
   CERRAR Y MANDAR AL TENDEDERO
===================================================== */

function closeCurrentPhoto(){

    if(currentPhoto === null){
        photoViewer.classList.remove("show");
        return;
    }

    const photoName = currentPhoto;
    const index = currentPhotoIndex;

    photoViewer.classList.remove("show");

    /*
       Esperamos a que desaparezca el visor
       y después mandamos la foto al tendedero.
    */

    setTimeout(function(){

        sendPhotoToLine(
            photoName,
            index
        );

    },350);

    currentPhoto = null;
    currentPhotoIndex = null;
}

/* =====================================================
   ENVIAR FOTO AL TENDEDERO
===================================================== */

function sendPhotoToLine(photoName,index){

    /*
       Evitamos duplicados.
    */

    if(document.querySelector(
        '.photo-polaroid[data-photo="' +
        CSS.escape(photoName) +
        '"]'
    )){
        return;
    }

    const slot =
        photoSlots[index] ||
        photoSlots[0];

    const polaroid =
        document.createElement("div");

    polaroid.className =
        "photo-polaroid";

    polaroid.dataset.photo =
        photoName;

    polaroid.style.left =
        slot.left;

    polaroid.style.setProperty(
        "--rotation",
        slot.rotation
    );

    const img =
        document.createElement("img");

    img.src = photoName;

    img.alt =
        "Nuestro recuerdo";

    const peg =
        document.createElement("div");

    peg.className = "peg";

    polaroid.appendChild(img);
    polaroid.appendChild(peg);

    photoLine.appendChild(polaroid);

}
