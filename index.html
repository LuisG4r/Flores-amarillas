<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti 💛</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #c3b091;
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 90%;
      padding: 20px;
    }

    /* 🌻 GIRASOL */
    .flor-container {
      position: relative;
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .tallo {
      width: 5px;
      height: 0;
      background: #2e7d32;
      animation: crecerTallo 2s ease forwards;
    }

    @keyframes crecerTallo {
      to {
        height: 90px;
      }
    }

    .flor {
      position: absolute;
      bottom: 80px;
      width: 60px;
      height: 60px;
      transform: scale(0);
      animation: florecer 1.5s ease forwards;
      animation-delay: 2s;
    }

    /* pétalos */
    .petalo {
      width: 20px;
      height: 20px;
      background: #fdd835;
      border-radius: 50%;
      position: absolute;
    }

    .centro {
      width: 25px;
      height: 25px;
      background: #5d4037;
      border-radius: 50%;
      position: absolute;
      top: 17px;
      left: 17px;
      z-index: 2;
    }

    /* posiciones de pétalos */
    .p1 { top: 0; left: 20px; }
    .p2 { top: 10px; left: 40px; }
    .p3 { top: 30px; left: 40px; }
    .p4 { top: 40px; left: 20px; }
    .p5 { top: 30px; left: 0; }
    .p6 { top: 10px; left: 0; }

    @keyframes florecer {
      to {
        transform: scale(1);
      }
    }

    /* contador */
    .contador {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
      animation-delay: 3.5s;
    }

    /* mensaje */
    .mensaje {
      margin-top: 25px;
      font-size: 18px;
      line-height: 1.6;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
      animation-delay: 5s;
    }

    .btn {
      margin-top: 30px;
      padding: 12px 25px;
      background: #fff;
      color: #333;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
      animation-delay: 6.5s;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 🌻 GIRASOL -->
    <div class="flor-container">
      <div class="tallo"></div>

      <div class="flor">
        <div class="petalo p1"></div>
        <div class="petalo p2"></div>
        <div class="petalo p3"></div>
        <div class="petalo p4"></div>
        <div class="petalo p5"></div>
        <div class="petalo p6"></div>
        <div class="centro"></div>
      </div>
    </div>

    <!-- ⏱ CONTADOR -->
    <div class="contador" id="contador"></div>

    <!-- 💛 MENSAJE -->
    <div class="mensaje">
      Hoy no puedo regalarte flores amarillas...<br><br>
      pero quería darte algo que dure más 💛<br>
      algo que puedas abrir cuando quieras<br>
      y recordar todo lo que hemos construido juntos.
    </div>

    <button class="btn" onclick="siguiente()">Ver más</button>

  </div>

  <script>
    // 🔥 CAMBIA TU FECHA AQUÍ
    const fechaInicio = new Date("2024-04-14T19:00:00");

    function actualizarContador() {
      const ahora = new Date();
      let diferencia = ahora - fechaInicio;

      let dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
      let meses = Math.floor(dias / 30);
      let horas = Math.floor((diferencia / (1000 * 60 * 60)) % 24);

      document.getElementById("contador").innerText =
        meses + " meses, " + dias + " días y " + horas + " horas juntos 💛";
    }

    actualizarContador();
    setInterval(actualizarContador, 1000);

    function siguiente() {
      alert("Aquí vamos a poner sus fotos 📸✨");
    }
  </script>

</body>
</html>
